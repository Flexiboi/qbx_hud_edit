<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="container">
        <div id="minimap_anchor" style="display: none;">
            <i class="fa-solid fa-map"></i>
            <span>MINIMAP ZONE</span>
        </div>
        <div id="stats">
            <div id="health" class="icons">
                <svg width="100%" height="100%" style="border: solid #8e1212 3px;">
                    <defs>
                        <linearGradient id="healthGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff4d4d; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8e1212; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#healthGradient)" />
                </svg>
                <i class="fa-solid fa-heart"></i>
            </div>
            <div id="hunger" class="icons">
                <svg width="100%" height="100%" style="border: solid #90551d 3px;">
                    <defs>
                        <linearGradient id="hungerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffcc5c; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#90551d; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#hungerGradient)" />
                </svg>
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div id="thirst" class="icons">
                <svg width="100%" height="100%" style="border: solid #1e4a89 3px;">
                    <defs>
                        <linearGradient id="thirstGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#4d79a8; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#1e4a89; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#thirstGradient)" />
                </svg>
                <i class="fa-solid fa-bottle-water"></i>
            </div>
            <div id="armor" class="icons">
                <svg width="100%" height="100%" style="border: solid #9b9917 3px;">
                    <defs>
                        <linearGradient id="armorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#9b9917; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5d5b1a; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#armorGradient)" />
                </svg>
                <i class="fa-solid fa-vest"></i>
            </div>
            <div id="oxygen" class="icons">
                <svg width="100%" height="100%" style="border: solid #1f8a91 3px;">
                    <defs>
                        <linearGradient id="oxygenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#4bafb6; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#1f8a91; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#oxygenGradient)" />
                </svg>
                <i class="fa-solid fa-mask-ventilator"></i>
            </div>
            <div id="stress" class="icons">
                <svg width="100%" height="100%" style="border: solid #7f2bd8 3px;">
                    <defs>
                        <linearGradient id="stressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#c974ff; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7f2bd8; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#stressGradient)" />
                </svg>
                <i class="fa-solid fa-brain"></i>
            </div>
        </div>
        <div id="vehicle">
            <div id="speed_card">
                <div id="vehicle_stats">
                    <div id="fuel_indicator" class="vehicle_stat">
                        <div class="stat_meter"><div id="fuel_bar" class="stat_meter_fill"></div></div>
                        <i class="fa-solid fa-gas-pump"></i>
                    </div>
                    <div id="engine_indicator" class="vehicle_stat">
                        <div class="stat_meter"><div id="engine_bar" class="stat_meter_fill engine-good"></div></div>
                        <i class="fa-solid fa-car-burst"></i>
                    </div>
                </div>
                <div id="speed_number">50</div>
                <div id="speed_meta">
                    <div id="seatbelt_status" class="status_badge">
                        <i class="fa-solid fa-square-check"></i>
                    </div>
                    <div id="speed_gear">GEAR 2</div>
                </div>
            </div>
        </div>
        <div id="compass">
            <div id="street">STREET NAME</div>
            <div id="degrees">0° N</div>
        </div>
    </div>
    <div id="extras">
        <div id="voice">
            <i class="fa-solid fa-microphone"></i>
            <svg style="border: solid #bd4c05 3px;">
                <defs>
                    <linearGradient id="voiceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ef8b26; stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d17010; stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#voiceGradient)" />
            </svg>
        </div>
    </div>
    <div id="settings_menu" style="display: none;">
        <h2>HUD Settings</h2>
        <p>Click and drag the HUD elements to move them.</p>
        <button id="save_hud">Save Positions</button>
        <button id="reset_hud">Reset Default</button>
        <button id="close_hud">Close</button>
    </div>
    <script src="assets/script.js"></script>
</body>
</html>
