<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" /></head>
<body>
    <div id="container">
        <div id="stats">
            <div id="health" class="icons">
                <i class="fa-solid fa-heart"></i>
                <svg width="200" height="30" style="border: solid #8e1212 3px;">
                    <defs>
                        <linearGradient id="healthGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff4d4d; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8e1212; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#healthGradient)" />
                </svg>
            </div>
            <div id="hunger" class="icons">
                <i class="fa-solid fa-utensils"></i>    
                <svg style="border: solid #90551d 3px;">
                    <defs>
                        <linearGradient id="hungerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffcc5c; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#90551d; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#hungerGradient)" />
                </svg>
            </div>
            <div id="thirst" class="icons">
                <i class="fa-solid fa-bottle-water"></i>
                <svg style="border: solid #1e4a89 3px;">                
                    <defs>
                        <linearGradient id="thirstGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#4d79a8; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#1e4a89; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#thirstGradient)" />
                </svg>
            </div>
            <div id="armor" class="icons">
                <i class="fa-solid fa-vest"></i>
                <svg style="border: solid #9b9917 3px;">                
                    <defs>
                        <linearGradient id="armorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#9b9917; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5d5b1a; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#armorGradient)" />
                </svg>
            </div>
            <div id="oxygen" class="icons">
                <i class="fa-solid fa-mask-ventilator"></i>
                <svg style="border: solid #1f8a91 3px;">                
                    <defs>
                        <linearGradient id="oxygenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#4bafb6; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#1f8a91; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#oxygenGradient)" />
                </svg>
            </div>
        </div>
        <div id="vehicle">
            <div id="speed_number"><div class="grey_text">000</div></div>
            <div id="speed_gear">GEAR 0</div>
            <svg class="vehicle_fuel" style="border: solid #2a740e 3px;">                
                <defs>
                    <linearGradient id="fuelGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#26d351; stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2bc652; stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#fuelGradient)" />
            </svg>
            <svg class="rpm_bar" style="border: solid #dc7106 3px;">                
                <defs>
                    <linearGradient id="rpmGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#fc9229; stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff9020; stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#rpmGradient)" />
            </svg>
        </div>
        <div id="compass">
            <div id="street">STREET NAME</div>
            <div id="degrees">0° N</div>
        </div>
        <div id="extras">
            <div id="voice">
                <i class="fa-solid fa-microphone"></i>
                <svg style="border: solid #bd4c05 3px;">                
                <defs>
                    <linearGradient id="voiceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ef8b26; stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d17010; stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#voiceGradient)" />
                </svg>
            </div>
        </div>
    </div>
</body>
<script src="assets/script.js"></script>
</html>
